<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Teleprompter</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black */
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 24px;
        overflow: hidden; /* Hide scrollbars, we will handle scrolling with JS */
        -webkit-app-region: drag; /* Allows moving the window by dragging anywhere */
        height: 100vh;
        box-sizing: border-box;
      }
      #text-container {
        height: 100%;
        overflow-y: hidden;
      }
      #prompter-text {
        width: 100%;
        height: 100%;
        background: transparent;
        color: inherit;
        font-family: inherit;
        font-size: inherit;
        border: none;
        resize: none;
        outline: none;
        -webkit-app-region: no-drag; /* Allows text selection/editing */
        line-height: 1.5;
      }
      /* Optional: Hide the scrollbar visually but allow programmatic scrolling */
      #prompter-text::-webkit-scrollbar {
        display: none;
      }
      #prompter-text {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  </head>
  <body>
    <div id="text-container">
      <textarea id="prompter-text" placeholder="Type or paste your script here..."></textarea>
    </div>
    <script>
      require('../dist/renderer.js');
    </script>
  </body>
</html>
